    <script>
        var scene;
        var camera;
        var renderer;
        var controls;

        function setup() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050505);

            camera = new THREE.PerspectiveCamera(
                10, // 35
                window.innerWidth / window.innerHeight,

                // 0.1 * 10 ** -11,
                // 1000 * 10 ** -11

                // 0.1 * 10 ** -54,
                // 1000 * 10 ** -54

                // simple for now.
                .1,
                1000

                // 0.1 * voxelsize,
                // 1000 * voxelsize
            );

            // camera.position.set(0, 0, 6 * BOHR_X);
            // camera.position.set(25, 25, 25);
            // camera.position.set(0, 0, 25);
            camera.position.set(0, 0, 200);
            // const camera_pos = 130;
            // camera.position.set(camera_pos * voxelsize, camera_pos * voxelsize, camera_pos * voxelsize);
            camera.lookAt(new THREE.Vector3(0, 0, 0));

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // optional

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            // controls.autoRotate = true;
            // controls.autoRotateSpeed = 0.1;

            // call controls.update() after a manual change to the camera
            controls.update();

            document.querySelector("#thescene").appendChild(renderer.domElement);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        setup();
    </script>
