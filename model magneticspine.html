        function setup() {
            scene = new THREE.Scene();

                10, // 35
                window.innerWidth / window.innerHeight,

            camera.lookAt(new THREE.Vector3(0, 0, 0));

            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // optional

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            // controls.autoRotate = true;
            // controls.autoRotateSpeed = 0.1;

            // call controls.update() after a manual change to the camera
            controls.update();

            document.querySelector("#thescene").appendChild(renderer.domElement);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        setup();
    </script>

        const ncirc = 20;

        const xaxis = new THREE.Vector3(1, 0, 0);
        const yaxis = new THREE.Vector3(0, 1, 0);

        function makeV2spineandloops(argshiftx = 0, argdraw = true, argflipy = false, argtoplusx = false, argtominusx = false, argtoz = false) {
            var arr_obj = [];

            for (var i = 0; i < ncirc; i++) {
                var circlei = getpointsoncircle(npointspercirc);
                var angle = (i / ncirc) * 2 * Math.PI;

                var j0point;
                for (var j = 0; j < npointspercirc; j++) {
                    let locp = circlei[j];
                    let locvec = (new vec(-locp.y, locp.x)).multiplyScalar(.1);

                    locp.applyAxisAngle(yaxis, angle);
                    locvec.applyAxisAngle(yaxis, angle);

                    if (j === 0) {
                        j0point = locp.clone();
                    }

                    locp.sub(j0point);

                    if (argflipy) {
                        locp.y *= -1;
                        locvec.y *= -1;
                    }
                    if (argtoplusx) {
                        locp.applyAxisAngle(zaxis, -Math.PI / 2);
                        locvec.applyAxisAngle(zaxis, -Math.PI / 2);
                    } else if (argtominusx) {
                        locp.applyAxisAngle(zaxis, Math.PI / 2);
                        locvec.applyAxisAngle(zaxis, Math.PI / 2);
                    }
                    if (argtoz) {
                        locp.applyAxisAngle(xaxis, Math.PI / 2);
                        locvec.applyAxisAngle(xaxis, Math.PI / 2);
                    }

                    locp.x += argshiftx;

                    if (argdraw) {
                        plotpoint(locp);
                        plotlinesegment(locvec, locp);
                    }
                    arr_obj.push({ keyp: locp, keyvec: locvec });
                }
            }

            return arr_obj;
        }
